# Release: a push to main whose newest commit message contains "[build]" builds, tests and publishes
# a GitHub release tagged v<modversion> from mod/PZButter/42/mod.info. Bump modversion first: an existing tag fails the run.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    env:
      ZB_VERSION: v2.3.4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Only ZombieBuddy's jar is needed to compile; the game's own jar can't be published and isn't used.
      - name: Fetch ZombieBuddy
        run: |
          mkdir -p "$RUNNER_TEMP/pz"
          curl -fsSL -o "$RUNNER_TEMP/pz/ZombieBuddy.jar" \
            "https://github.com/zed-0xff/ZombieBuddy/releases/download/$ZB_VERSION/ZombieBuddy.jar"

      - name: Build and test
        run: JDK="$JAVA_HOME" PZ_GAME="$RUNNER_TEMP/pz" ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^modversion=//p' mod/PZButter/42/mod.info)
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::release v$v already exists; bump modversion in mod/PZButter/42/mod.info"
            exit 1
          fi
          (cd build/mod && zip -qr "../PZButter-$v.zip" PZButter)
          gh release create "v$v" "build/PZButter-$v.zip" --target "$GITHUB_SHA" \
            --title "PZ Butter $v" --generate-notes
